# Summary: Short one-line description shown in search results (max ~80 chars).
Summary: Minecraft companion app for console players and server managers

# Description: Full description shown on the app's F-Droid page.
# Uses a limited Markdown-like format. Paragraphs are separated by blank lines.
# No HTML; use `` for inline code, '''...''' for code blocks.
Description: |-
  MCCompanion lets you bridge external Minecraft (Bedrock Edition) servers to
  your local network so that PlayStation, Xbox, Nintendo Switch, and other
  consoles can join as if it were a LAN game.

  Features include:

  * **Connector** – Bridge any external server via EU/US relay for low latency.
  * **Skins** – Browse, preview, and manage Minecraft skins via Geyser.
  * **Player Lookup** – Search players by gamertag, username, or UUID.
  * **Server Tracker** – Monitor server status and player count in real time.
  * **Partner Servers** – Browse and connect to featured community servers.
  * **Wiki** – Offline reference for mobs, blocks, items, biomes, potions, and more.
  * **Profile & Social** – Sign in with Xbox, Apple, or Google and chat with other users.

# AntiFeatures: MUST be declared if the app uses proprietary services or has
# other drawbacks. Undisclosed anti-features cause F-Droid to reject the app.
#
# NonFreeNet  – App communicates with a non-free (proprietary) network service.
#               This app uses:
#               • Firebase (firebase_core, firebase_auth, firebase_messaging) –
#                 Google's proprietary backend platform.
#               • Google Sign-In (google_sign_in) – proprietary OAuth flow.
#               • RevenueCat (purchases_flutter) – proprietary subscription platform.
#
# NonFreeDep  – App depends on a non-free library/SDK bundled into the APK.
#               This app bundles the RevenueCat Android SDK via purchases_flutter.
#
# ⚠️  IMPORTANT NOTE TO MAINTAINER:
#   F-Droid reviewers may ask you to provide a build variant that removes or
#   stubs out Firebase, Google Sign-In, and RevenueCat, because these are
#   incompatible with F-Droid's free-software principles. In-app purchases
#   (purchases_flutter / RevenueCat) are especially likely to be questioned.
#   Consider creating a free-only flavor or feature flag for F-Droid builds.
AntiFeatures:
  NonFreeNet:
    - Uses Firebase (Google proprietary backend) for authentication and push notifications
    - Uses Google Sign-In (proprietary OAuth)
    - Uses RevenueCat (proprietary subscription and IAP service)
  NonFreeDep:
    - Bundles RevenueCat Android SDK via purchases_flutter

# RepoType: The version control system used for the source code.
# "git" is correct for GitHub repositories.
RepoType: git

# Repo: The URL F-Droid's build server will clone to build the app.
# Must be the HTTPS clone URL (not SSH).
Repo: https://github.com/MCCORG/MCCompanion

# Builds: A list of build entries, one per released version.
# Each entry tells F-Droid exactly how to reproduce the APK from source.
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️  YOU MUST update this section for every new release you submit to F-Droid.
#     The `commit` value must point to an exact git tag or commit SHA that
#     corresponds to the versionCode/versionName.
# ─────────────────────────────────────────────────────────────────────────────
Builds:
  - # versionName: The human-readable version string shown to users.
    # Must match flutter versionName in pubspec.yaml (before the '+').
    versionName: '4.1.5'

    # versionCode: The integer build number used by Android to detect upgrades.
    # Must match flutter versionCode in pubspec.yaml (the number after '+').
    versionCode: 42

    # commit: The exact git commit SHA or tag at which this version was released.
    # This project publishes a rolling prerelease from GitHub Actions using the
    # static `dev` tag, but F-Droid requires an immutable source reference.
    # This SHA is intentionally pinned for reproducibility; before every
    # fdroiddata submission, verify that the GitHub `dev` release still points
    # to this exact commit and replace it if the workflow has published a newer one.
    commit: 77d151403944bb017a23b39a5f606b6fed6e49eb

    # output: Path (relative to repo root) of the APK produced by the build.
    # Flutter's default release APK location for a single-ABI build.
    output: build/app/outputs/flutter-apk/app-release.apk

    # srclibs: External source libraries that F-Droid's build server must
    # download and make available during the build. `flutter@stable` tells the
    # build server to use the stable Flutter channel.
    # The `$$flutter$$` placeholder expands to the Flutter SDK path.
    srclibs:
      - flutter@stable

    # build: Shell commands run (inside the repo root) to produce the APK.
    # Steps:
    #   1. Disable Flutter's anonymous analytics (required by F-Droid policy).
    #   2. Fetch Dart/Flutter package dependencies.
    #   3. Build the standard Flutter release APK.
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release

# AutoUpdateMode: Controls how F-Droid updates the build recipe.
# This repository uses a rolling `dev` prerelease tag generated by CI rather than
# immutable version tags, so metadata updates should stay manual.
AutoUpdateMode: None

