# Since the workflow reuses the same `dev` tag, automatic tag-based update
# detection is not reliable here. Keep this manual unless you later publish
# immutable release tags or expose a machine-readable version endpoint.
UpdateCheckMode: None

# CurrentVersion: The latest version string known at the time this file was written.
# Must be updated together with the latest Builds entry's versionName.
CurrentVersion: '4.1.5'

# CurrentVersionCode: The latest version code known at the time this file was written.
