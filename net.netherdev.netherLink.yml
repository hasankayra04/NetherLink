# Categories: Tells F-Droid which section(s) to list the app under.
# Valid values: Connectivity, Development, Games, Graphics, Internet,
#   Money, Multimedia, Navigation, Phone & SMS, Reading, Science & Education,
#   Security, Sports & Health, System, Theming, Time, Writing
# "Games" is used here because the app is Minecraft-specific.
